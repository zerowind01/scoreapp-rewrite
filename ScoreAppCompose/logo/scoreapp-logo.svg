<?xml version="1.0" encoding="utf-8"?>
<!--
  乐谱管理 · Logo

  构成：墨黑圆角方底 + 一张带折角的乐谱纸 + 四线谱 + 八分音符。
  配色沿用应用自身的设计令牌（Accent #111113 / Surface #FFFFFF），
  因此图标与界面是同一套语言，而不是另起一套品牌色。

  视口 108×108 是 Android 自适应图标的画布；前景内容收在中心直径 66 的
  安全区内（21–87），这样各家厂商的圆形/水滴形遮罩都不会切到图形。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- 底：仅用于独立展示与旧系统 PNG 回退；自适应图标的底由 background 提供 -->
  <rect width="108" height="108" rx="24" fill="#111113"/>

  <!-- 乐谱纸（右上角折角） -->
  <path d="M31 33 Q31 27 37 27 H67 L77 37 V75 Q77 81 71 81 H37 Q31 81 31 75 Z" fill="#FFFFFF"/>
  <!-- 折角的翻面，用浅灰区分于纸面 -->
  <path d="M67 27 L77 37 H67 Z" fill="#C9C9CE"/>

  <!-- 四线谱 -->
  <g stroke="#111113" stroke-width="2.2" stroke-linecap="round">
    <line x1="39" y1="45" x2="69" y2="45"/>
    <line x1="39" y1="53.5" x2="69" y2="53.5"/>
    <line x1="39" y1="62" x2="69" y2="62"/>
    <line x1="39" y1="70.5" x2="69" y2="70.5"/>
  </g>

  <!-- 八分音符：符头 + 符干 + 符尾。
       白色描边把音符从谱线上"衬"出来——小尺寸下纯黑音符会糊进线里 -->
  <g fill="#111113" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round">
    <path d="M40.2 66 A6.9 5.2 -20 0 1 54 66 A6.9 5.2 -20 0 1 40.2 66 Z"/>
    <path d="M51.8 43 H54.2 V66 H51.8 Z"/>
    <path d="M54.2 43 C61 44 64.5 48.5 63 54 C61 49.5 57.5 47.5 54.2 48 Z"/>
  </g>
</svg>
