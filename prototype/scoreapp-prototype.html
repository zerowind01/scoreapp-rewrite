<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>乐谱管理 · UI 原型</title>
<style>
  /* ============ 设计令牌（取自原应用 Tokens.kt 解码值） ============ */
  :root{
    --bg-page:#F4F4F6; --surface:#FFFFFF; --surface2:#F1F1F4; --surface3:#E9E9EC;
    --text1:#111113; --text2:#6C6C73; --text3:#A5A5AD; --line:#ECECEF;
    --accent:#111113; --accent-fg:#FFFFFF;
    --tag-type-fg:#1D5C8A; --tag-type-bg:#E6F1F9;
    --tag-inst-fg:#5B3D8A; --tag-inst-bg:#EFE9FA;
    --pill-live:#0D7A4A; --link:#0A72C4;
    --danger-bg:#FDECEC; --danger-fg:#D23A3A;
    --tab-inactive:#9D9DA5;
    --r-card:18px; --r-thumb:8px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font); background:#DEDEE3; color:var(--text1);
    display:flex; align-items:center; justify-content:center; padding:24px 12px; min-height:100vh;
  }

  /* ============ 手机外壳 ============ */
  .phone{
    width:390px; height:844px; background:var(--bg-page); border-radius:44px;
    box-shadow:0 28px 70px rgba(20,20,30,.28), 0 0 0 11px #1B1B1F, 0 0 0 13px #33333A;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .statusbar{
    height:48px; flex:0 0 48px; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 6px; font-size:14px; font-weight:600; letter-spacing:.2px; color:var(--text1);
  }
  .statusbar .icons{display:flex;gap:6px;align-items:center;}
  .statusbar .icons i{display:block;width:16px;height:11px;border-radius:2px;background:var(--text1);opacity:.85;}
  .statusbar .icons i.b{width:22px;height:11px;border-radius:3px;}
  .statusbar .icons i.c{width:6px;height:11px;border-radius:1px;}

  .viewport{flex:1 1 auto;position:relative;overflow:hidden;}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;}

  /* ============ 滚动区 ============ */
  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:16px;}
  .scroll::-webkit-scrollbar{display:none;}
  /* 导航改成悬浮导台后不再占据文档流，内容会滚到导台下方被遮住，
     因此由滚动区自己预留出「导台高度 + 上下留白」的底部空间。
     导台压薄后所需避让空间同步收敛：12(距底) + 52(高) + 28(呼吸) ≈ 92 */
  .with-nav .scroll{padding-bottom:92px;}

  /* ============ 顶部标题区 ============ */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:10px;}
  .titles{display:flex;align-items:baseline;gap:16px;min-width:0;}
  .title-tab{
    font-size:27px;font-weight:800;letter-spacing:-.6px;color:var(--tab-inactive);
    background:none;border:0;padding:0;font-family:var(--font);cursor:pointer;transition:color .16s;
  }
  .title-tab.on{color:var(--text1);}
  .title-single{font-size:27px;font-weight:800;letter-spacing:-.6px;color:var(--text1);}
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .iconbtn{
    width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text1);
    box-shadow:0 1px 2px rgba(17,17,19,.06);transition:transform .12s,background .16s;
  }
  .iconbtn:active{transform:scale(.92);}
  .iconbtn.on{background:var(--accent);color:var(--accent-fg);}
  .iconbtn svg{width:19px;height:19px;display:block;}

  /* ============ 搜索 ============ */
  .searchwrap{padding:8px 16px 2px;}
  .searchbox{
    display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:14px;
    padding:11px 14px;box-shadow:0 1px 2px rgba(17,17,19,.05);
  }
  .searchbox svg{width:17px;height:17px;color:var(--text3);flex:0 0 auto;}
  .searchbox input{
    border:0;outline:0;background:none;flex:1;font-size:15px;font-family:var(--font);color:var(--text1);min-width:0;
  }
  .searchbox input::placeholder{color:var(--text3);}
  .searchbox .clr{border:0;background:var(--surface3);color:var(--text2);width:20px;height:20px;border-radius:50%;
    font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;}
  .searchbox.has .clr{display:flex;}

  /* ============ 分组 chip 行 ============ */
  .chiprow{display:flex;gap:8px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
    background:var(--surface);border:1px solid transparent;font-size:13px;font-weight:600;color:var(--text2);
    cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .chip.on{background:var(--accent);color:var(--accent-fg);}
  .chip svg{width:14px;height:14px;}
  .chip .n{font-size:11px;opacity:.7;font-weight:700;}

  /* 生效中的筛选摘要 */
  .activefilters{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px 0;}
  .afchip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;border-radius:999px;
    background:var(--surface);font-size:12px;font-weight:600;color:var(--text2);
  }
  .afchip b{font-weight:700;color:var(--text1);}
  .afchip .x{border:0;background:var(--surface3);color:var(--text2);width:16px;height:16px;border-radius:50%;
    font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}

  /* ============ 分组头 ============ */
  .grouphead{
    display:flex;align-items:baseline;gap:8px;padding:18px 16px 8px;
  }
  .grouphead .gh-name{font-size:15px;font-weight:800;letter-spacing:-.2px;}
  .grouphead .gh-n{font-size:12px;color:var(--text3);font-weight:600;}

  /* ============ 乐谱卡片 ============ */
  .list{padding:6px 16px 0;display:flex;flex-direction:column;gap:11px;}
  .list.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px;}
  .card{
    background:var(--surface);border-radius:var(--r-card);padding:11px;display:flex;gap:12px;
    box-shadow:0 1px 3px rgba(17,17,19,.07);cursor:pointer;transition:transform .12s,box-shadow .16s;
    align-items:flex-start;
  }
  .card:active{transform:scale(.985);}
  .list.grid .card{flex-direction:column;gap:9px;padding:10px;}
  .thumb{
    flex:0 0 auto;width:74px;height:96px;border-radius:var(--r-thumb);overflow:hidden;background:#FBF9F4;
    box-shadow:inset 0 0 0 1px rgba(17,17,19,.07);position:relative;
  }
  .thumb canvas{display:block;width:100%;height:100%;}
  .list.grid .thumb{width:100%;height:118px;}
  .card-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .card-title{
    font-size:14.5px;font-weight:700;line-height:1.32;letter-spacing:-.2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-sub{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
  .mtag{
    display:inline-flex;align-items:center;padding:3px 7px;border-radius:6px;
    font-size:10.5px;font-weight:600;letter-spacing:.1px;
  }
  .mtag.type{color:var(--tag-type-fg);background:var(--tag-type-bg);}
  .mtag.inst{color:var(--tag-inst-fg);background:var(--tag-inst-bg);}
  .mtag.ai{color:var(--link);background:#E7F2FC;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px;}
  .card-foot .pages{font-size:11px;color:var(--text3);font-weight:600;}
  .card-foot .more{
    width:26px;height:26px;border-radius:50%;border:0;background:var(--surface2);color:var(--text2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .card-foot .more svg{width:15px;height:15px;}

  /* ============ 空状态 ============ */
  .empty{padding:64px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;}
  .empty .eico{width:52px;height:52px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text3);}
  .empty .eico svg{width:24px;height:24px;}
  .empty h4{margin:0;font-size:15px;font-weight:700;}
  .empty p{margin:0;font-size:12.5px;color:var(--text3);line-height:1.5;}

  /* ============ 合集卡 ============ */
  .setcard{
    background:var(--surface);border-radius:var(--r-card);padding:14px;display:flex;gap:14px;
    box-shadow:0 1px 3px rgba(17,17,19,.07);cursor:pointer;align-items:center;
    transition:box-shadow .35s ease, transform .35s ease;
  }
  /* 从别处跳转到某个谱单时的临时高亮，便于用户一眼定位 */
  .setcard.hl{box-shadow:0 0 0 2px var(--link), 0 6px 18px rgba(10,114,196,.18);transform:translateY(-1px);}
  .stack{position:relative;width:86px;height:104px;flex:0 0 auto;}
  .stack canvas{position:absolute;border-radius:6px;box-shadow:0 1px 4px rgba(17,17,19,.16);background:#FBF9F4;}

  /* ============ 作曲家 ============ */
  /* 右侧留出 A–Z 索引条宽度，否则「N 位」会被索引压住 */
  .letterhead{padding:14px 26px 6px 16px;font-size:13px;font-weight:800;color:var(--text3);letter-spacing:.6px;display:flex;align-items:baseline;justify-content:space-between;}
  .letterhead .lh-n{font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--text3);}
  .composerrow{
    display:flex;align-items:center;gap:13px;padding:11px 26px 11px 16px;cursor:pointer;transition:background .14s;
  }
  .composerrow:active{background:var(--surface2);}
  .avatar{
    width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px;
  }
  .composerrow .c-main{flex:1;min-width:0;}
  .composerrow .c-name{font-size:14.5px;font-weight:700;letter-spacing:-.2px;}
  .composerrow .c-sub{font-size:11.5px;color:var(--text3);margin-top:2px;}
  .composerrow .c-n{font-size:12.5px;color:var(--text3);font-weight:600;}
  /* ---- 作曲家作品页 ---- */
  .workstop{display:flex;align-items:center;gap:12px;padding:10px 16px 12px;}
  .workstop .back{
    width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:flex;align-items:center;
    justify-content:center;cursor:pointer;color:var(--text1);box-shadow:0 1px 2px rgba(17,17,19,.06);flex:0 0 auto;
  }
  .workstop .back svg{width:19px;height:19px;}
  .workstop h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;}
  .workshead{display:flex;align-items:center;gap:14px;padding:0 16px 12px;}
  .workshead .avatar{width:54px;height:54px;font-size:20px;}
  .wh-main{min-width:0;}
  .wh-name{font-size:20px;font-weight:800;letter-spacing:-.3px;}
  .wh-full{font-size:13px;color:var(--text3);margin-top:3px;}
  .wh-n{font-size:12.5px;font-weight:700;color:var(--text2);margin-top:5px;}
  .azindex{
    position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
    align-items:center;gap:1px;padding:4px 3px;z-index:4;
  }
  .azindex span{font-size:9px;font-weight:700;color:var(--text3);line-height:1.25;cursor:pointer;}
  .azindex span:hover{color:var(--text1);}

  /* ============ 我的 ============ */
  .stats{display:flex;gap:11px;padding:12px 16px 0;}
  .statcard{
    flex:1;background:var(--surface);border-radius:14px;padding:13px 12px;text-align:left;
    box-shadow:0 1px 3px rgba(17,17,19,.06);
  }
  .statcard .v{font-size:22px;font-weight:800;letter-spacing:-.6px;}
  .statcard .k{font-size:11.5px;color:var(--text3);margin-top:2px;font-weight:600;}
  .sectionhead{padding:20px 16px 8px;font-size:13px;font-weight:800;color:var(--text2);letter-spacing:.2px;}
  .panel{background:var(--surface);border-radius:var(--r-card);margin:0 16px;overflow:hidden;box-shadow:0 1px 3px rgba(17,17,19,.06);}
  .panelrow{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative;}
  .panelrow + .panelrow::before{content:"";position:absolute;left:50px;right:0;top:0;height:1px;background:var(--line);}
  .panelrow .pico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text1);flex:0 0 auto;}
  .panelrow .pico svg{width:19px;height:19px;}
  .panelrow .plabel{flex:1;font-size:14px;font-weight:600;}
  .panelrow .pval{font-size:12.5px;color:var(--text3);font-weight:600;}
  .panelrow .pval.live{color:var(--pill-live);}
  .panelrow .arrow{color:var(--text3);display:flex;}
  .panelrow .arrow svg{width:16px;height:16px;}
  /* 可点击的面板行：带箭头就应当有可点的手感，否则是假交互 */
  .panelrow.link{cursor:pointer;transition:background .14s;}
  .panelrow.link:active{background:var(--surface2);}
  /* 删除类操作的二次确认态：首次点击后整行/整钮转为实色危险态 */
  .panelrow.armed{background:var(--danger-bg);}
  .panelrow.armed .plabel, .panelrow.armed .pico{color:var(--danger-fg);}
  .btn.danger.armed{background:var(--danger-fg);color:#fff;}
  .profile{display:flex;align-items:center;gap:14px;padding:6px 16px 4px;}
  .profile .avatar{width:56px;height:56px;font-size:20px;}
  .profile .pn{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  .profile .ps{font-size:12.5px;color:var(--text3);margin-top:3px;}

  /* ============ 底部导航（胶囊悬浮导台） ============ */
  /* 不再贴底通栏，而是浮在内容之上的一片胶囊玻璃：两端为半圆收口（弧形），四周留空。
     行高刻意压低（内容 44px + 上下 4px），比常规底栏更"薄"，让出更多阅读区。 */
  .bottomnav{
    position:absolute;left:14px;right:14px;bottom:12px;z-index:6;
    display:flex;align-items:center;gap:2px;
    padding:4px;
    /* 高度 54px（内容 44 + 上下 4 + 边框 1×2）⇒ 半径取 27px 恰好等于高度一半，
       两端得到真正的半圆收口，而不是"圆角矩形" */
    border-radius:27px;
    background:rgba(255,255,255,.62);
    /* 毛玻璃：加厚模糊 + 提饱和，让底下内容透出来但不过分干扰阅读 */
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,.72);
    box-shadow:0 10px 30px rgba(17,17,19,.16), 0 2px 8px rgba(17,17,19,.08);
  }
  /* 不支持毛玻璃时的降级：给一层足够不透明的底，保证可读性 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .bottomnav{background:rgba(255,255,255,.96);}
  }
  .navitem{
    position:relative;z-index:1;
    flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    height:44px;justify-content:center;
    padding:0;cursor:pointer;color:var(--tab-inactive);font-family:var(--font);
    border-radius:22px;transition:color .16s;
  }
  .navitem svg{width:21px;height:21px;}
  .navitem span{font-size:10px;font-weight:600;line-height:1;}
  .navitem.on{color:var(--text1);}
  /* 选中项：白色圆形气泡浮在玻璃之上，对应参考图里那颗高亮圆底。
     用伪元素绘制，避免它被 .navitem 的层叠上下文切掉圆形边角。 */
  .navitem.on::before{
    content:"";position:absolute;inset:-4px 3px;border-radius:999px;
    background:rgba(255,255,255,.9);
    box-shadow:0 3px 10px rgba(17,17,19,.12);
    z-index:-1;
  }
  .navitem:active::before{
    content:"";position:absolute;inset:-4px 3px;border-radius:999px;
    background:rgba(255,255,255,.6);z-index:-1;
  }

  /* ============ FAB ============ */
  .fab{
    /* 抬到导台上方：导台底部 12px + 高度 52px，再留 14px 间隙避免压住最右侧页签 */
    position:absolute;right:16px;bottom:78px;width:54px;height:54px;border-radius:19px;border:0;
    /* 主操作保持实心强调色：导台已是半透明玻璃，FAB 再透明会失去「首要动作」的视觉权重。
       仅沿用导台的圆角与投影语言，使两者同属一套悬浮体系。 */
    background:var(--accent);color:var(--accent-fg);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 8px 20px rgba(17,17,19,.3);z-index:7;transition:transform .14s;
  }
  .fab:active{transform:scale(.93);}
  .fab svg{width:24px;height:24px;}

  /* ============ 底部弹层 ============ */
  .scrim{position:absolute;inset:0;background:rgba(17,17,19,.34);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--bg-page);border-radius:26px 26px 0 0;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.22,.9,.28,1);z-index:21;
    max-height:88%;display:flex;flex-direction:column;box-shadow:0 -8px 34px rgba(17,17,19,.2);
  }
  .sheet.on{transform:translateY(0);}
  .sheet.tall{height:82%;}
  .sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--surface3);margin:9px auto 2px;flex:0 0 auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;flex:0 0 auto;}
  .sheet-head h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .sheet-head .close{
    width:30px;height:30px;border-radius:50%;border:0;background:var(--surface3);color:var(--text2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .sheet-head .close svg{width:16px;height:16px;}
  .sheet-body{flex:1 1 auto;overflow-y:auto;padding:0 18px 10px;scrollbar-width:none;}
  .sheet-body::-webkit-scrollbar{display:none;}
  .sheet-foot{flex:0 0 auto;padding:10px 18px 24px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--bg-page);}

  .sectitle{display:flex;align-items:center;justify-content:space-between;padding:15px 0 9px;}
  .sectitle .st-l{font-size:13px;font-weight:800;color:var(--text1);display:inline-flex;flex-direction:column;}
  .sectitle .st-r{font-size:12px;color:var(--link);font-weight:700;cursor:pointer;background:none;border:0;font-family:var(--font);}
  .sectitle .st-sub{display:block;font-size:11.5px;font-weight:500;color:var(--text3);margin-top:2px;}
  .divider{height:1px;background:var(--line);margin:4px 0;}
  .flowchips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:2px;}
  .fchip{
    display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;background:var(--surface);
    border:1px solid transparent;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:.15s;
    font-family:var(--font);
  }
  .fchip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
  .fchip .n{
    font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:6px;background:var(--surface3);color:var(--text3);
  }
  .fchip.on .n{background:rgba(255,255,255,.22);color:#fff;}
  .fchip.dim{opacity:.4;}

  .field{padding:11px 0 3px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text2);padding-bottom:6px;}
  .field input{
    width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;
    font-size:14.5px;font-family:var(--font);color:var(--text1);outline:0;transition:border-color .16s;
  }
  .field input:focus{border-color:var(--text3);}
  .field .sugg{display:flex;gap:7px;flex-wrap:wrap;padding-top:8px;}
  .suggchip{

<script>
"use strict";
/* =====================================================================
   1. 领域常量（对齐原应用的下拉选项与别名表）
   ===================================================================== */
const LEVELS      = ["初级","中级","高级","演奏级"];
const PERIODS     = ["巴洛克","古典","浪漫","印象主义","现代","未分类"];
const TYPES       = ["奏鸣曲","练习曲","前奏曲","赋格","协奏曲","组曲","变奏曲","夜曲","圆舞曲","叙事曲","即兴曲","交响曲","室内乐"];
const INSTRUMENTS = ["钢琴","小提琴","大提琴","长笛","单簧管","管弦乐","声乐"];
const SOURCES     = ["Henle 原版","Peters 版","Bärenreiter 版","本地导入","未编目"];

/* 姓氏 → 全名别名表 */
/* 姓氏 → 全名。
   前 17 条还原自原应用的别名表；其后的条目是为演示数据集补充的，
   原应用只预置了 1 首乐谱，不覆盖这些作曲家。补齐是为了让 A–Z
   索引条上不会出现汉字（initialOf 的兜底会把汉字原样返回）。 */
const ALIAS = {
  "巴赫":"约翰·塞巴斯蒂安·巴赫","贝多芬":"路德维希·范·贝多芬","肖邦":"弗雷德里克·弗朗索瓦·肖邦",
  "莫扎特":"沃尔夫冈·阿玛多伊斯·莫扎特","德彪西":"阿希尔-克洛德·德彪西","门德尔松":"费利克斯·门德尔松",
  "帕格尼尼":"尼科罗·帕格尼尼","舒伯特":"弗朗茨·舒伯特","勃拉姆斯":"约翰内斯·勃拉姆斯",
  "柴可夫斯基":"彼得·伊里奇·柴可夫斯基","李斯特":"弗朗茨·李斯特","海顿":"约瑟夫·海顿",
  "维瓦尔第":"安东尼奥·维瓦尔第","拉赫玛尼诺夫":"谢尔盖·拉赫玛尼诺夫","车尔尼":"卡尔·车尔尼",
  "佚名":"佚名","合集":"合集",
  /* ---- 以下为演示数据集补充 ---- */
  "舒曼":"罗伯特·舒曼","穆索尔斯基":"莫杰斯特·穆索尔斯基","帕赫贝尔":"约翰·帕赫贝尔",
  "克莱门蒂":"穆齐奥·克莱门蒂","斯特拉文斯基":"伊戈尔·斯特拉文斯基","比才":"乔治·比才"
};
/* 姓氏 → 首字母索引 */
const SURNAME_INITIAL = {
  "巴赫":"B","贝多芬":"B","肖邦":"X","莫扎特":"M","德彪西":"D","门德尔松":"M","帕格尼尼":"P","舒伯特":"S",
  "勃拉姆斯":"B","柴可夫斯基":"C","李斯特":"L","海顿":"H","维瓦尔第":"W","拉赫玛尼诺夫":"L","车尔尼":"C",
  "佚名":"Y","合集":"H",
  /* ---- 以下为演示数据集补充 ---- */
  "舒曼":"S","穆索尔斯基":"M","帕赫贝尔":"P","克莱门蒂":"K","斯特拉文斯基":"S","比才":"B"
};
/* 头像色相池 */
const HUES = ["#b0552f","#3a6ea5","#6b4fa0","#2f7d5b","#a8412f","#4a5a8a","#8a6a24","#7a3f5c","#3f6b6b","#5c5c66"];

/* =====================================================================
   2. 工具：姓名处理 / 头像色
   ===================================================================== */
/** 取姓氏：按中点「·」切分后取最后一段 */
function shortName(full){
  if(!full) return full;
  const parts = full.split("·");
  return parts.length > 1 ? parts[parts.length-1] : full;
}
/** 首字母索引：优先查表，否则取首字符大写，非字母归入 #
 *  注意：与 Java Character.isLetter 对齐，中日韩汉字同样视为字母 */
function initialOf(full){
  const s = shortName(full);
  if(SURNAME_INITIAL[s]) return SURNAME_INITIAL[s];
  const c = s.charAt(0);
  return /\p{L}/u.test(c) ? c.toUpperCase() : "#";
}
/** Java 风格 31 进制哈希（保持与原实现一致的溢出行为） */
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (Math.imul(h,31) + s.charCodeAt(i)) | 0; }
  return h;
}
/** 由姓名推导头像底色：哈希取色相池 → 转 HSL(h, .46, .46) */
function avatarColor(name){
  const hex = HUES[Math.abs(hashStr(name)) % HUES.length];
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  let h = 0;
  if(d !== 0){
    if(max === r)      h = (((g-b)/d) % 6) * 60;
    else if(max === g) h = (((b-r)/d) + 2) * 60;
    else               h = (((r-g)/d) + 4) * 60;
    h = ((h + 360) % 360);
  }
  return `hsl(${h.toFixed(1)}, 46%, 46%)`;
}

/* =====================================================================
   3. 程序化缩略图绘制（独立实现的「雕版乐谱」渲染器）
   ===================================================================== */
/** 确定性伪随机数（同一 seed 永远得到同一张缩略图） */
function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * 绘制雕版乐谱页：若干谱表系统 + 音符 + 小节线
 * @param {CanvasRenderingContext2D} c
 * @param {number} w 宽  @param {number} h 高
 * @param {object} score
 * @param {boolean} dense 密集模式（网格缩略图）
 */
function drawEngrave(c, w, h, score, dense){
  const r = rng(score.thumbSeed || 1);
  const paper = "#FBF9F4";
  c.clearRect(0,0,w,h);
  c.fillStyle = paper; c.fillRect(0,0,w,h);

  const rows  = Math.max(1, Math.min(score.thumbRows || 5, 8));
  const cols  = Math.max(1, Math.min(score.thumbCols || 1, 3));
  const pad   = Math.max(4, w * 0.07);
  const innerW = w - pad*2;
  const topPad = h * (dense ? 0.09 : 0.13);
  const botPad = h * 0.07;
  const usableH = h - topPad - botPad;
  const sysGap = usableH / rows;

  // 标题横线（纸张抬头）
  if(!dense){
    c.fillStyle = "rgba(17,17,19,.20)";
    c.fillRect(w*0.30, h*0.055, w*0.40, Math.max(1.6, h*0.008));
  }

  const ink = "rgba(24,22,20,.80)";
  const staff = "rgba(24,22,20,.26)";

  for(let row=0; row<rows; row++){
    const sysTop = topPad + row*sysGap;
    const staffH = Math.min(sysGap*0.40, h*0.075);
    const lineGap = staffH/4;

    // 5 条谱线
    c.strokeStyle = staff;
    c.lineWidth = Math.max(0.5, h*0.0026);
    for(let i=0;i<5;i++){
      const y = sysTop + i*lineGap;
      c.beginPath(); c.moveTo(pad, y); c.lineTo(w-pad, y); c.stroke();
    }

    // 音符：每系统按列数划分小节
    const noteCount = 5 + Math.floor(r()*7);
    const cellW = innerW / noteCount;
    c.fillStyle = ink;
    for(let n=0; n<noteCount; n++){
      if(r() < 0.14) continue;                       // 留白，避免机械感
      const cx = pad + cellW*(n+0.5);
      const step = Math.floor(r()*5);                // 音高落在谱表哪一条线附近
      const cy = sysTop + step*lineGap;
      const rw = Math.max(1.5, cellW*0.30), rh = rw*0.68;

      // 符头
      c.beginPath();
      c.ellipse(cx, cy, rw, rh, -0.32, 0, Math.PI*2);
      c.fill();

      // 符干
      const up = r() > 0.45;
      c.strokeStyle = ink;
      c.lineWidth = Math.max(0.6, w*0.008);
      c.beginPath();
      if(up){ c.moveTo(cx+rw*0.9, cy); c.lineTo(cx+rw*0.9, cy-staffH*0.92); }
      else  { c.moveTo(cx-rw*0.9, cy); c.lineTo(cx-rw*0.9, cy+staffH*0.92); }
      c.stroke();

      // 小节线
      if((n+1) % cols === 0 && n < noteCount-1){
        const bx = pad + cellW*(n+1);
        c.strokeStyle = "rgba(24,22,20,.42)";
        c.lineWidth = Math.max(0.6, w*0.007);
        c.beginPath();
        c.moveTo(bx, sysTop - lineGap*0.5);
        c.lineTo(bx, sysTop + staffH + lineGap*0.5);
        c.stroke();
      }
    }
  }
  // 纸张内描边
  c.strokeStyle = "rgba(17,17,19,.07)";
  c.lineWidth = 1;
  c.strokeRect(0.5, 0.5, w-1, h-1);
}

/** 绘制唱片封面型缩略图（thumbKind === "cover"） */
function drawCover(c, w, h, score){
  // Canvas 的 font 不接受 CSS 变量，必须给出真实字体栈
  const FONT_STACK = '-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  c.clearRect(0,0,w,h);
  const c1 = score.coverC1 || "#4e1a13";
  const c2 = score.coverC2 || "#8d2f22";
  const g = c.createLinearGradient(0,0,w,h);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  c.fillStyle = g; c.fillRect(0,0,w,h);

  // 装饰：同心弧
  c.strokeStyle = "rgba(255,255,255,.16)";
  c.lineWidth = Math.max(1, w*0.012);
  for(let i=0;i<3;i++){
    c.beginPath();
    c.arc(w*0.5, h*0.46, w*(0.18 + i*0.11), Math.PI*1.08, Math.PI*1.92);
    c.stroke();
  }

  const tc = score.coverTColor || "#ffffff";
  const size = Math.max(9, w * ((score.coverTSize || 15)/100) * 0.62);
  c.fillStyle = tc;
  c.textAlign = "center";
  c.font = `700 ${size}px ${FONT_STACK}`;
  c.fillText(score.coverTitle || "", w*0.5, h*0.44);

  if(score.coverEn){
    c.font = `500 ${Math.max(6,size*0.42)}px ${FONT_STACK}`;
    c.globalAlpha = 0.72;
    c.fillText(score.coverEn, w*0.5, h*0.44 + size*0.95);
    c.globalAlpha = 1;
  }
  if(score.coverSub){
    c.font = `500 ${Math.max(6,size*0.40)}px ${FONT_STACK}`;
    c.globalAlpha = 0.8;
    c.fillText(score.coverSub, w*0.5, h*0.90);
    c.globalAlpha = 1;
  }
  if(score.coverBarText){
    c.fillStyle = "rgba(0,0,0,.34)";
    c.fillRect(0, h*0.80, w, h*0.075);
    c.fillStyle = tc;
    c.font = `600 ${Math.max(6,size*0.40)}px ${FONT_STACK}`;
    c.fillText(score.coverBarText, w*0.5, h*0.80 + h*0.052);
  }
  c.strokeStyle = "rgba(17,17,19,.07)";
  c.lineWidth = 1;
  c.strokeRect(0.5,0.5,w-1,h-1);
}

/** 统一入口：按 thumbKind 分派 */
function paintThumb(canvas, score, dense){
  const w = canvas.clientWidth || canvas.width;
  const h = canvas.clientHeight || canvas.height;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(h*dpr);
  const c = canvas.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  if(score.thumbKind === "cover") drawCover(c, w, h, score);
  else drawEngrave(c, w, h, score, !!dense);
}

/* =====================================================================
   4. 数据源（依据原样例结构构造的古典乐谱库）
   ===================================================================== */
let SCORE_SEQ = 1000;
function mk(title, composer, type, instrument, period, level, source, pages, opts){
  opts = opts || {};
  const id = ++SCORE_SEQ;
  return Object.assign({
    id, title, composer, type, instrument, period, level, source, pages,
    dateAdded: Date.now() - id*86400000,
    filePath: null, assetPdf: null, isAi: false,
    thumbKind: "engrave",
    thumbSeed: (id*37) % 997,
    thumbCols: 1, thumbRows: Math.max(3, Math.min(Math.round(pages/2), 6)),
    coverTitle:null, coverEn:null, coverTColor:null, coverDeco:null, coverFooter:false,
    coverBarText:null, coverSub:null, coverC1:null, coverC2:null
  }, opts);
}

const SCORES = [
  mk("《升c小调第十四钢琴奏鸣曲「月光」》Op.27 No.2","路德维希·范·贝多芬","奏鸣曲","钢琴","古典","高级","Henle 原版",14,

   6. 业务逻辑：搜索 / 筛选 / 分组 / 统计
   ===================================================================== */
/** 关键词搜索：命中 title / composer / type / instrument / period / source */
function matchesQuery(s, q){
  const key = (q || "").trim().toLowerCase();
  if(!key) return true;
  return [s.title, s.composer, s.type, s.instrument, s.period, s.source]
    .some(v => (v || "").toLowerCase().includes(key));
}
/** 单条乐谱是否满足给定筛选集（维度内取并集，维度间取交集） */
function matchesFilters(s, f){
  if(f.composer.size   && !f.composer.has(s.composer))     return false;
  if(f.type.size       && !f.type.has(s.type))             return false;
  if(f.instrument.size && !f.instrument.has(s.instrument)) return false;
  return true;
}
/** 可见乐谱 = 搜索 ∩ 筛选 */
function visibleScores(){
  return SCORES.filter(s => matchesQuery(s, state.query) && matchesFilters(s, state.filters));
}
/** 排序 */
function sortScores(list){
  const by = state.sort;
  const arr = list.slice();
  if(by === "composer")      arr.sort((a,b)=> a.composer.localeCompare(b.composer,"zh") || a.title.localeCompare(b.title,"zh"));
  else if(by === "title")    arr.sort((a,b)=> a.title.localeCompare(b.title,"zh"));
  else if(by === "dateAdded")arr.sort((a,b)=> b.dateAdded - a.dateAdded);
  else if(by === "pages")    arr.sort((a,b)=> b.pages - a.pages);
  return arr;
}
/** 分组：组内数量降序，数量相同按组名升序；作曲家分组显示姓氏 */
function groupScores(list, groupBy){
  const map = new Map();
  for(const s of list){
    const key = s[groupBy] || "未分类";
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(s);
  }
  const keys = [...map.keys()].sort((a,b)=>{
    const d = map.get(b).length - map.get(a).length;
    return d !== 0 ? d : a.localeCompare(b, "zh");
  });
  return keys.map(k => ({
    key: k,
    label: groupBy === "composer" ? shortName(k) : k,
    items: map.get(k)
  }));
}
/** 分面计数：在「其它维度」的约束下，该取值的命中数 */
function facetCount(dim, value){
  const others = {composer:true, type:true, instrument:true};
  delete others[dim];
  return SCORES.filter(s => {
    if(s[dim] !== value) return false;
    if(!matchesQuery(s, state.query)) return false;
    for(const d in others){
      if(state.pending[d].size && !state.pending[d].has(s[d])) return false;
    }
    return true;
  }).length;
}
/** 待应用筛选条件下的结果总数 */
function pendingResultCount(){
  return SCORES.filter(s => matchesQuery(s, state.query) && matchesFilters(s, state.pending)).length;
}
/** 某维度下出现过的全部取值（按出现次数降序） */
function facetValues(dim){
  const m = new Map();
  for(const s of SCORES){
    const v = s[dim] || "未分类";
    m.set(v, (m.get(v)||0)+1);
  }
  return [...m.keys()].sort((a,b)=> (m.get(b)-m.get(a)) || a.localeCompare(b,"zh"));
}
/** 去重统计：作曲家数 / 类型数 / 乐器数 */
function distinct(field){
  return new Set(SCORES.map(s => s[field])).size;
}
/** 作曲家人数按姓氏聚合 */
function composerGroups(){
  const m = new Map();
  for(const s of SCORES){
    if(!m.has(s.composer)) m.set(s.composer, []);
    m.get(s.composer).push(s);
  }
  return [...m.entries()].map(([full, items])=>({
    full, short: shortName(full), initial: initialOf(full), items
  })).sort((a,b)=> a.full.localeCompare(b.full, "zh"));
}
/** 谱单成员：谱单以 thumbSeed 引用乐谱，而非自增 id */
function setMembers(set){
  return set.seeds.map(seed => SCORES.find(s => s.thumbSeed === seed)).filter(Boolean);
}
/** 反查：这首乐谱归属于哪些谱单（用于详情页「分类归属」） */
function setsOfScore(score){
  if(!score) return [];
  return SETS.filter(set => set.seeds.indexOf(score.thumbSeed) >= 0);
}
/** 按 id 取乐谱；取不到时返回 null，交由调用方决定如何处理 */
function scoreById(id){
  return SCORES.find(s => s.id === id) || null;
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/** 顶部工具栏 */
function topbarHTML(){
  if(state.tab === "manage"){
    const tools = [
      {k:"search", icon: state.searchOpen ? ICON.list : ICON.search, on: state.searchOpen, title:"搜索"},
      {k:"filter", icon: ICON.filter, on: hasActiveFilters(), title:"筛选与分组"},
      {k:"grid",   icon: state.grid ? ICON.list : ICON.grid, on: state.grid, title:"切换视图"},
      {k:"sort",   icon: ICON.sort, on:false, title:"排序"}
    ];
    return `<div class="topbar">
      <div class="titles">
        <button class="title-tab ${state.libTab==="scores"?"on":""}" data-act="libtab" data-v="scores">乐谱库</button>
        <button class="title-tab ${state.libTab==="sets"?"on":""}" data-act="libtab" data-v="sets">合集</button>
      </div>
      <div class="tools">${tools.map(t =>
        `<button class="iconbtn ${t.on?"on":""}" title="${t.title}" data-act="tool" data-v="${t.k}">${t.icon}</button>`).join("")}
      </div></div>`;
  }
  if(state.tab === "composers"){
    return `<div class="topbar">
      <div class="titles"><span class="title-single">作曲家</span></div>
      <div class="tools">
        <button class="iconbtn ${state.searchOpen?"on":""}" title="搜索" data-act="tool" data-v="search">${state.searchOpen?ICON.list:ICON.search}</button>
      </div></div>`;
  }
  return `<div class="topbar">
    <div class="titles"><span class="title-single">我的</span></div>
  </div>`;
}

function searchHTML(placeholder){
  if(!state.searchOpen) return "";
  const val = state.tab === "composers" ? state.composerQuery : state.query;
  return `<div class="searchwrap">
    <div class="searchbox ${val?"has":""}">
      ${ICON.search}
      <input id="searchInput" placeholder="${esc(placeholder)}" value="${esc(val)}" autocomplete="off" />
      <button class="clr" data-act="clearquery">✕</button>
    </div></div>`;
}

function hasActiveFilters(){
  const f = state.filters;
  return f.composer.size + f.type.size + f.instrument.size > 0;
}

/** 乐谱卡片 */
function scoreCardHTML(s, dense){
  const tags = [
    `<span class="mtag type">${esc(s.type)}</span>`,
    `<span class="mtag inst">${esc(s.instrument)}</span>`
  ];
  if(s.isAi) tags.push(`<span class="mtag ai">AI 识别</span>`);
  return `<article class="card" data-act="open" data-id="${s.id}">
    <div class="thumb"><canvas data-thumb="${s.id}" data-dense="${dense?1:0}"></canvas></div>
    <div class="card-body">
      <div class="card-title">${esc(s.title)}</div>
      <div class="card-sub">${esc(s.composer)}</div>
      <div class="card-tags">${tags.join("")}</div>
      <div class="card-foot">
        <span class="pages">${s.pages} 页 · ${esc(s.period)} · ${esc(s.level)}</span>
        <button class="more" data-act="edit" data-id="${s.id}" title="编辑">${ICON.more}</button>
      </div>
    </div></article>`;
}

/** 乐谱库页 */
function renderScoresTab(){
  const list = sortScores(visibleScores());
  if(!list.length){
    return `<div class="empty">
      <div class="eico">${ICON.book}</div>
      <h4>没有匹配的乐谱</h4>
      <p>换个关键词或首字母试试</p>
    </div>`;
  }
  const groups = groupScores(list, state.groupBy);
  return groups.map(g => `
    <div class="grouphead">
      <span class="gh-name">${esc(g.label)}</span>
      <span class="gh-n">${g.items.length} 首</span>
    </div>
    <div class="list ${state.grid?"grid":""}">
      ${g.items.map(s => scoreCardHTML(s, state.grid)).join("")}
    </div>`).join("");
}

/** 筛选摘要 chip 行 */
function activeFiltersHTML(){
  if(!hasActiveFilters()) return "";
  const chips = [];
  for(const dim of ["composer","type","instrument"]){
    for(const v of state.filters[dim]){
      chips.push(`<span class="afchip">${esc(dim==="composer"?shortName(v):v)}
        <button class="x" data-act="rmfilter" data-dim="${dim}" data-v="${esc(v)}">✕</button></span>`);
    }
  }
  chips.push(`<span class="afchip" style="cursor:pointer" data-act="clearfilters"><b>清空</b></span>`);
  return `<div class="activefilters">${chips.join("")}</div>`;
}

/** 分组 chip 行 */
function groupChipsHTML(){
  const opts = [["composer","按作曲家"],["type","按曲目类型"],["instrument","按乐器"]];
  return `<div class="chiprow">
    ${opts.map(([k,label]) =>
      `<button class="chip ${state.groupBy===k?"on":""}" data-act="setgroup" data-v="${k}">${ICON.layers}${label}</button>`).join("")}
  </div>`;
}

/** 主内容渲染 */
function renderMain(){
  // 作曲家作品页是压在页签之上的一层视图
  if(state.works){
    $("content").innerHTML = renderWorks();
    $("fab").style.display = "none";
    $("bottomnav").innerHTML = bottomNavHTML();
    paintAllThumbs();
    return;
  }
  let html = topbarHTML();

  if(state.tab === "manage"){
    html += searchHTML("搜索曲名、作曲家、类型、乐器…");
    if(state.libTab === "scores"){
      html += groupChipsHTML();
      html += activeFiltersHTML();
      html += `<div id="listArea">${renderScoresTab()}</div>`;
    }else{
      html += renderSetsTab();
    }
    $("fab").style.display = "flex";
  }
  else if(state.tab === "composers"){
    html += searchHTML("搜索作曲家（中文 / 拼音）");
    const q = state.composerQuery.trim().toLowerCase();
    const groups = composerGroups().filter(g =>
      !q || g.full.toLowerCase().includes(q) || g.short.toLowerCase().includes(q));
    if(!groups.length){
      html += `<div class="empty"><div class="eico">${ICON.person}</div>
        <h4>没有匹配的作曲家</h4><p>换个关键词或首字母试试</p></div>`;
    }else{
      const byLetter = new Map();
      for(const g of groups){
        if(!byLetter.has(g.initial)) byLetter.set(g.initial, []);

      const letters = [...byLetter.keys()].sort();
      html += letters.map(L => `
        <div class="letterhead" id="letter-${L}"><span>${L}</span><span class="lh-n">${byLetter.get(L).length} 位</span></div>

    </div>

      <div class="statcard"><div class="v">${nSet}</div><div class="k">谱单</div></div>

    </div>

    <div class="panel">

      <div class="panelrow"><span class="pico">${ICON.music}</span><span class="plabel">乐器</span><span class="pval">${distinct("instrument")} 种</span></div>

/**
 * 作曲家作品页。
 *
 * 顶栏是固定标题「作品」，作曲家身份放在下方抬头块里，
 * 避免同一个名字在一屏里出现两次以上。
 */
function renderWorks(){
  const composer = state.works;
  const works = SCORES.filter(s => s.composer === composer)
    .sort((a,b) => a.title.localeCompare(b.title, "zh"));
  let html = `
    <div class="workstop">
      <button class="back" data-act="closeworks" title="返回">${ICON.back}</button>
      <h2>作品</h2>
    </div>
    <div class="workshead">
      <div class="avatar lg" style="background:${avatarColor(composer)}">${esc(initialOf(composer))}</div>
      <div class="wh-main">
        <div class="wh-name">${esc(shortName(composer))}</div>
        <div class="wh-full">${esc(composer)}</div>
        <div class="wh-n">${works.length} 首作品</div>
      </div>
    </div>`;

  if(!works.length){
    html += `<div class="empty"><div class="eico">${ICON.note}</div><h4>暂无作品</h4></div>`;
    return html;
  }

  html += `<div class="list">${works.map(s => scoreCardHTML(s, false)).join("")}</div>`;
  return html;
}

/** 批量绘制当前 DOM 中的缩略图 */
function paintAllThumbs(){
  document.querySelectorAll("canvas[data-thumb]").forEach(cv => {
    const s = SCORES.find(x => x.id === +cv.dataset.thumb);
    if(s) paintThumb(cv, s, cv.dataset.dense === "1");
  });
  document.querySelectorAll("canvas[data-setthumb]").forEach(cv => {
    const s = SCORES.find(x => x.id === +cv.dataset.setthumb);
    if(s) paintThumb(cv, s, true);
  });
}

/**
 * 详情页头部的元信息行：`曲目类型 · 乐器 · 时期 / 风格 · 难度`。
 * 空白字段会被剔除，避免留下悬空的分隔符。
 */
function metaLine(s){
  return [s.type, s.instrument, s.period, s.level].filter(x => x && String(x).trim()).join(" · ");
}

/**
 * 详情页「分类归属」面板：这首乐谱属于哪些谱单。
 *
 * 这里原先渲染的是「作曲家 / 曲目类型 / 乐器」三行，与「元数据」面板前 3 行
 * 一字不差 —— 抄一遍元数据并没有回答「归属」这个问题，真正的归属是谱单。
 */
function belongHTML(score){
  const sets = setsOfScore(score);
  if(!sets.length){
    return `<div class="panel" style="padding:0 14px"><div class="kvs">
      <div class="kv"><span class="k">谱单</span>
      <span class="v" style="color:var(--text3);font-weight:600">尚未加入任何谱单</span></div>
    </div></div>`;
  }
  return `<div class="panel">${sets.map(set => `
      <div class="panelrow link" data-act="openset" data-i="${SETS.indexOf(set)}"
           title="查看谱单：${esc(set.name)}">
        <span class="pico">${ICON.layers}</span>
        <span class="plabel">${esc(set.name)}</span>
        <span class="pval">${setMembers(set).length} 首</span>
        <span class="arrow">${ICON.chev}</span>
      </div>`).join("")}</div>`;
}

function fmtDate(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/**
 * 保存时的字段归一化。
 *
 * 原应用在保存回调里对每个空字段填入固定占位取值，
 * 避免空串在筛选分面里裂成额外的桶。
 */
function normalizeDraft(d){
  const t = v => String(v == null ? "" : v).trim();
  return Object.assign({}, d, {
    title:      t(d.title),
    composer:   t(d.composer) || "佚名",
    type:       t(d.type) || "未编目",
    instrument: t(d.instrument) || "未分类",
    period:     t(d.period) || "未指定",
    level:      t(d.level) || "—",
    source:     t(d.source) || "本地导入",
    pages:      parseInt(d.pages, 10) || 1
  });
}

/* =====================================================================
   10. 弹层
   ===================================================================== */
function openSheet(kind, target){
  state.sheet = kind;
  if(kind === "edit"){
    state.editTarget = target || null;
    state.editDraft = Object.assign({}, target);
    $("sheetTitle").textContent = "编辑乐谱";
    $("sheet").classList.toggle("tall", true);
  }else if(kind === "filter"){
    state.pending = {
      composer:new Set(state.filters.composer),
      type:new Set(state.filters.type),
      instrument:new Set(state.filters.instrument)
    };
    state.pendingGroup = state.groupBy;
    $("sheetTitle").textContent = "筛选与分组";
    $("sheet").classList.toggle("tall", true);
  }else if(kind === "import"){
    $("sheetTitle").textContent = "导入乐谱";
    $("sheet").classList.toggle("tall", false);
  }else if(kind === "sort"){
    $("sheetTitle").textContent = "排序方式";
    $("sheet").classList.toggle("tall", false);
  }else if(kind === "more"){
    state.moreTarget = target || null;
    $("sheetTitle").textContent = "更多";
    $("sheet").classList.toggle("tall", false);
  }else if(kind === "set"){
    state.setTarget = target || null;
    $("sheetTitle").textContent = target ? target.name : "谱单";
    $("sheet").classList.toggle("tall", true);
  }
  renderSheet();
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
}

function closeSheet(){
  state.sheet = null;
  // 弹层关闭后不留残骸：草稿、作用对象与未完成的确认态一起清掉，
  // 否则下一次打开编辑弹层会短暂看到上一首乐谱的内容。
  state.editDraft = null;
  state.editTarget = null;
  state.moreTarget = null;
  state.setTarget = null;
  disarmConfirm();
  $("scrim").classList.remove("on");
  $("sheet").classList.remove("on");
}

/** 退出「二次确认」态并复原按钮文案 */
function disarmConfirm(){
  clearTimeout(state.confirmTimer);
  if(state.confirmArmed){
    state.confirmArmed.classList.remove("armed");
    if(state.confirmText && state.confirmOrigin != null){
      state.confirmText.textContent = state.confirmOrigin;
    }
  }
  state.confirmArmed = null;
  state.confirmText = null;
  state.confirmOrigin = null;
}

/**
 * 危险操作的二次确认：首次点击只把文案换成确认态，再点一次才执行。
 *
 * 删除不可撤销，而弹层里「删除」与「保存」并排、间距很小，误触代价太高。
 * 3 秒无操作自动复原，避免确认态一直挂着，用户下次进来看到的是一个陌生的按钮。
 *
 * @param {HTMLElement} row  承载 data-act 的节点（用于加 armed 样式）
 * @param {HTMLElement} text 显示文案的节点
 */
function armConfirm(row, text, armedText, onConfirm){
  if(state.confirmArmed === row){
    const run = onConfirm;
    disarmConfirm();
    run();
    return;
  }
  disarmConfirm();
  state.confirmArmed = row;
  state.confirmText = text;
  state.confirmOrigin = text.textContent;
  text.textContent = armedText;
  row.classList.add("armed");
  state.confirmTimer = setTimeout(disarmConfirm, 3000);
}

function renderSheet(){
  const k = state.sheet;
  if(k === "filter")  return renderFilterSheet();
  if(k === "edit")    return renderEditSheet();
  if(k === "import")  return renderImportSheet();
  if(k === "sort")    return renderSortSheet();
  if(k === "more")    return renderMoreSheet();
  if(k === "set")     return renderSetSheet();
}

      <div class="panelrow" data-act="edit" data-id="${s.id}">
        <span class="pico">${ICON.edit}</span><span class="plabel">编辑元数据</span><span class="arrow">${ICON.chev}</span></div>
      <div class="panelrow" data-act="delete" data-id="${s.id}">
        <span class="pico" style="color:var(--danger-fg)">${ICON.trash}</span>
        <span class="plabel" style="color:var(--danger-fg)">从乐谱库删除</span></div>
    </div>`;
  $("sheetFoot").innerHTML = `<button class="btn ghost wide" data-act="esheetclose">取消</button>`;
}

function facetSectionHTML(dim, title){
  const vals = facetValues(dim);
  const chips = vals.map(v => {
    const on  = state.pending[dim].has(v);
    const cnt = facetCount(dim, v);
    return `<button class="fchip ${on?"on":""} ${cnt===0&&!on?"dim":""}"
      data-act="pfacet" data-dim="${dim}" data-v="${esc(v)}">
      ${esc(dim==="composer"?shortName(v):v)}<span class="n">${cnt}</span></button>`;
  }).join("");
  return `<div class="sectitle">
      <span class="st-l">${title}</span>
      <button class="st-r" data-act="pclear" data-dim="${dim}">清空</button>
    </div>
    <div class="flowchips">${chips}</div>`;
}

function renderFilterSheet(){
  const groups = [["composer","按作曲家"],["type","按曲目类型"],["instrument","按乐器"]];
  $("sheetBody").innerHTML = groups.map(([d,t],i) =>
    (i ? '<div class="divider" style="margin:14px 0 0"></div>' : "") + facetSectionHTML(d,t)).join("")
    + `<div class="divider" style="margin:16px 0 0"></div>
       <div class="sectitle"><span class="st-l">分组方式<span class="st-sub">决定列表如何归类</span></span></div>
       <div class="flowchips">
         ${[["composer","按作曲家"],["type","按曲目类型"],["instrument","按乐器"]].map(([k,label]) =>
           `<button class="fchip ${state.pendingGroup===k?"on":""}" data-act="pgroup" data-v="${k}">${label}</button>`).join("")}
       </div>`;
  $("sheetFoot").innerHTML = `
    <button class="btn ghost" data-act="preset">重置</button>
    <button class="btn primary" data-act="papply">查看 ${pendingResultCount()} 个结果</button>`;
}

function editFieldHTML(key, label, placeholder, value, suggestions){
  return `<div class="field">
    <label>${label}</label>
    <input data-edit="${key}" value="${esc(value)}" placeholder="${placeholder}" />
    ${suggestions ? `<div class="sugg">${suggestions.slice(0,6).map(s =>
      `<button class="suggchip" data-act="sugg" data-k="${key}" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
  </div>`;
}

function renderEditSheet(){
  const d = state.editDraft;
  $("sheetBody").innerHTML =
    editFieldHTML("title","标题","乐谱标题", d.title, null) +
    editFieldHTML("composer","作曲家（点选下方常用姓氏自动填全名）","如 路德维希·范·贝多芬", d.composer, Object.values(ALIAS)) +
    editFieldHTML("type","曲目类型","如 奏鸣曲", d.type, TYPES) +
    editFieldHTML("instrument","乐器","如 钢琴", d.instrument, INSTRUMENTS) +
    editFieldHTML("period","时期 / 风格","如 浪漫", d.period, PERIODS) +
    editFieldHTML("level","难度","如 高级", d.level, LEVELS) +
    editFieldHTML("source","来源","如 本地导入", d.source, SOURCES) +
    editFieldHTML("pages","页数","如 16", d.pages, null) +
    `<div style="height:8px"></div>`;
  $("sheetFoot").innerHTML = `
    ${state.editTarget ? `<button class="btn danger" data-act="edel" style="flex:0 0 92px">删除</button>` : ""}
    <button class="btn ghost" data-act="esheetclose" style="flex:0 0 78px">取消</button>
    <button class="btn primary" data-act="esave">保存</button>`;
}

function renderImportSheet(){
  $("sheetBody").innerHTML = `
    <div class="importrow" data-act="pickimages">
      <div class="iico">${ICON.photo}</div>
      <div class="im"><h4>从相册选择图片</h4>
      <p>多选图片，自动合并为一份 PDF 乐谱</p></div>
      <span style="color:var(--text3);display:flex">${ICON.chev}</span>
    </div>
    <div class="importrow" data-act="pickpdf">
      <div class="iico">${ICON.file}</div>
      <div class="im"><h4>选择 PDF 文件</h4>
      <p>直接导入已有 PDF 乐谱</p></div>
      <span style="color:var(--text3);display:flex">${ICON.chev}</span>
    </div>
    <p style="font-size:11.5px;color:var(--text3);line-height:1.6;padding:6px 4px 0">
      图片导入会按 A4（595 × 842 pt）逐页居中排版，最长边压到 1400 px 后写入
      <code>files/scores/import_&lt;标题&gt;_&lt;时间戳&gt;.pdf</code>。</p>`;
  $("sheetFoot").innerHTML = `<button class="btn ghost wide" data-act="esheetclose">取消</button>`;
}

function renderSortSheet(){
  const opts = [["composer","按作曲家"],["title","按标题"],["dateAdded","最近添加"],["pages","页数从多到少"]];
  $("sheetBody").innerHTML = `<div class="flowchips" style="padding-top:8px">
    ${opts.map(([k,label]) =>
      `<button class="fchip ${state.sort===k?"on":""}" data-act="setsort" data-v="${k}">${label}</button>`).join("")}
  </div>`;
  $("sheetFoot").innerHTML = `<button class="btn primary wide" data-act="esheetclose">完成</button>`;
}

function renderSetSheet(){
  const set = state.setTarget;
  if(!set) return;
  const items = setMembers(set);
  $("sheetBody").innerHTML = `
    <p style="font-size:12.5px;color:var(--text2);line-height:1.6;margin:0 0 12px">${esc(set.desc)}</p>
    <div class="list" style="padding:0;gap:9px">
      ${items.map(s => scoreCardHTML(s,false)).join("")}
    </div>`;
  $("sheetFoot").innerHTML = `<button class="btn primary wide" data-act="opensetplay">打开谱单</button>`;
}

/* =====================================================================
   11. Toast
   ===================================================================== */
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=> el.classList.remove("on"), 2200);
}

function copyCrashLog(){
  const txt = "uncaught@2026-09-17 01:12:44  device=Android 14  abi=arm64-v8a\n" +
              "java.lang.IllegalStateException: PdfRenderer: file not opened\n" +
              "  at com.example.scoreapp.ui.components.PdfDocState.open(PdfViewer.kt:88)\n";
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("日志已复制")).catch(()=>toast("复制失败"));
  else toast("日志已复制");
}

/* =====================================================================
   12. 事件分发
   ===================================================================== */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const v = el.dataset.v;
  const id = +el.dataset.id;

  switch(act){
    case "tab":
      state.tab = v; state.searchOpen = false; state.works = null;
      renderMain(); break;

    case "libtab":
      state.libTab = v; renderMain(); break;

    case "tool":
      if(v === "search"){ state.searchOpen = !state.searchOpen; renderMain();
        const i = $("searchInput"); if(i) i.focus(); }
      else if(v === "grid"){ state.grid = !state.grid; renderMain(); }
      else if(v === "filter"){ openSheet("filter"); }
      else if(v === "sort"){ openSheet("sort"); }
      break;

    case "clearquery":
      if(state.tab === "composers") state.composerQuery = ""; else state.query = "";
      renderMain(); break;

    case "setgroup":
      state.groupBy = v; renderMain(); break;

    case "rmfilter":
      state.filters[el.dataset.dim].delete(el.dataset.v); renderMain(); break;

    case "clearfilters":
      state.filters = {composer:new Set(), type:new Set(), instrument:new Set()};
      renderMain(); toast("已清空筛选"); break;

    case "open": {
      const s = scoreById(id);
      if(s) openDetail(s);
      break;
    }

    case "closedetail":
      closeDetail(); break;

    case "edit": {
      const s = scoreById(id);
      if(!s) break;
      ev.stopPropagation();
      openSheet("edit", s); break;
    }

    case "delete": {
      const s = scoreById(id);
      if(!s) break;
      // 删除不可撤销，且与「打开乐谱 / 编辑元数据」贴在同一列，先要一次确认
      armConfirm(el, el.querySelector(".plabel"), "确认删除，不可撤销", () => doDelete(s));
      break;
    }

    case "share":
      doShare(scoreById(id)); break;

    case "openpdf":
      doOpenPdf(scoreById(id)); break;

    case "more": {
      const s = scoreById(id);
      if(!s) break;
      ev.stopPropagation();
      openSheet("more", s); break;
    }

    case "opencomposer": {
      // 进入这位作曲家的作品页，而不是把筛选条件塞进乐谱库
      state.query = ""; state.searchOpen = false;
      state.tab = "composers";
      state.works = el.dataset.name;
      renderMain();
      break;
    }

    case "closeworks":
      state.works = null;
      renderMain();
      break;

    case "jump": {
      const t = document.getElementById("letter-" + v);
      if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
      break;
    }

    case "openset": {
      const set = SETS[+el.dataset.i];
      if(set) openSheet("set", set);
      break;
    }

    case "setting":
      if(v === "storage") toast("乐谱存储目录：files/scores/ · 已占用 128 MB");
      else if(v === "cache") toast("已清理 24 MB 缩略图缓存");
      else if(v === "ai"){
        state.aiOn = !state.aiOn;
        toast(state.aiOn ? "已开启自动识别元数据" : "已关闭自动识别元数据");
        renderMain();
      }
      break;

    case "opensetplay": {
      const set = state.setTarget;
      if(!set) break;
      // 真跳转：切到「合集」页签并定位到该谱单，而不是只弹一句提示
      state.tab = "manage";
      state.libTab = "sets";
      state.highlightSet = set.name;
      closeSheet();
      renderMain();
      requestAnimationFrame(() => {
        const card = document.querySelector(`.setcard[data-name="${CSS.escape(set.name)}"]`);
        if(card) card.scrollIntoView({behavior:"smooth", block:"center"});
      });
      toast(`已定位到谱单：${set.name}`);
      clearTimeout(state.highlightTimer);
      state.highlightTimer = setTimeout(() => {
        state.highlightSet = null;
        const card = document.querySelector(`.setcard[data-name="${CSS.escape(set.name)}"]`);
        if(card) card.classList.remove("hl");
      }, 1800);
      break;
    }

    /* ---- 筛选弹层 ---- */
    case "pfacet": {
      const dim = el.dataset.dim, val = el.dataset.v;
      const set = state.pending[dim];
      set.has(val) ? set.delete(val) : set.add(val);
      renderSheet(); break;
    }
    case "pclear":
      state.pending[el.dataset.dim] = new Set(); renderSheet(); break;
    case "pgroup":
      state.pendingGroup = v; renderSheet(); break;
    case "preset":
      state.pending = {composer:new Set(), type:new Set(), instrument:new Set()};
      state.pendingGroup = "composer"; renderSheet(); break;
    case "papply":
      state.filters = {
        composer:new Set(state.pending.composer),
        type:new Set(state.pending.type),
        instrument:new Set(state.pending.instrument)
      };
      state.groupBy = state.pendingGroup;
      closeSheet(); renderMain();
      toast(`已筛选出 ${pendingResultCount()} 首乐谱`); break;

    /* ---- 编辑弹层 ---- */
    case "sugg": {
      const k = el.dataset.k;
      const inp = document.querySelector(`input[data-edit="${k}"]`);
      if(inp){ inp.value = el.dataset.v; state.editDraft[k] = el.dataset.v; }
      break;
    }
    case "esave": {
      const target = state.editTarget;
      if(!target) break;
      collectEditDraft();
      const d = normalizeDraft(state.editDraft);
      if(!d.title){ toast("请填写标题"); break; }
      Object.assign(target, d);
      toast("已保存修改");
      closeSheet();
      // 详情页是独立的一层视图，改完必须重绘，否则它仍显示改动前的元数据
      if(state.detail && state.detail.id === target.id) openDetail(state.detail);
      renderMain(); break;
    }
    case "edel": {
      // 与「保存」并排在同一个 footer 里，误触代价高，先要一次确认
      armConfirm(el, el, "确认删除", () => doDelete(state.editTarget));
      break;
    }
    case "esheetclose":
      closeSheet(); break;

    /* ---- 排序 ---- */
    case "setsort":
      state.sort = v; renderSheet(); renderMain(); break;

    /* ---- 导入 ---- */
    case "pickimages":
      closeSheet();
      importScore(true, 2);
      break;
    case "pickpdf":
      closeSheet();
      importScore(false, 1);
      break;
  }
});

function collectEditDraft(){
  document.querySelectorAll("input[data-edit]").forEach(inp => {
    const k = inp.dataset.edit;
    state.editDraft[k] = k === "pages" ? (+inp.value || 1) : inp.value;
  });
}

function doDelete(score){
  if(!score) return;
  const i = SCORES.indexOf(score);
  if(i >= 0) SCORES.splice(i,1);
  toast(`已删除「${score.title.slice(0,12)}${score.title.length>12?"…":""}」`);
  // 只关掉正在看的那一份详情，避免删 A 时把 B 的详情页一起收起来
  if(state.detail && state.detail.id === score.id) closeDetail();
  closeSheet(); renderMain();
}

function doShare(score){
  if(!score) return;
  if(score.filePath || score.assetPdf) toast("已分享 PDF：" + (score.filePath || score.assetPdf));
  else toast("这份乐谱还没有 PDF 文件，已分享曲谱信息");
}

function doOpenPdf(score){
  if(!score) return;
  if(score.filePath || score.assetPdf) toast("打开乐谱：" + (score.filePath || score.assetPdf));
  else toast("这份乐谱还没有 PDF 文件，可在列表里导入");
}

/**
 * 导入一份乐谱：真正写入曲库，而不是只弹一句提示。
 *
 * 原先导入路径只 toast、不落库（`SCORE_SEQ` / `mk` 的分配能力因此被闲置），
 * 用户点完「从相册选择图片」列表里什么都不会多出来。
 * 这里复用 `mk` 分配新 id 并登记添加时间，同时补上虚拟的 filePath，
 * 使分享 / 打开 PDF 有文件可指。
 *
 * @param {boolean} fromAlbum  true 表示来自相册图片合成，false 表示直接选中的 PDF
 * @param {number}  pageCount  页数（相册合成通常多页）
 */
function importScore(fromAlbum, pageCount){
  const stamp = Date.now();
  const shortStamp = String(stamp).slice(-6);
  const title = fromAlbum ? `相册乐谱 · ${shortStamp}` : `本地乐谱_${shortStamp}`;
  const score = mk(
    title, "佚名", "未编目", "未分类", "未指定", "—",
    fromAlbum ? "相册导入" : "本地导入",
    pageCount > 0 ? pageCount : 1,
    {
      dateAdded: stamp,
      filePath: `files/scores/import_${title}_${stamp}.pdf`,
      thumbRows: pageCount >= 6 ? 6 : (pageCount <= 3 ? 3 : 5)
    }
  );
  // 新导入的乐谱置顶，符合「最近添加」的直觉
  SCORES.unshift(score);
  toast(`已加入乐谱库：${title}`);
  renderMain();
}

/* 输入事件 */
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.id === "searchInput"){
    if(state.tab === "composers") state.composerQuery = t.value;
    else state.query = t.value;
    const pos = t.selectionStart;
    renderMain();
    const ni = $("searchInput");
    if(ni){ ni.focus(); ni.setSelectionRange(pos,pos); }
  }
  if(t.dataset && t.dataset.edit) state.editDraft[t.dataset.edit] = t.value;
});

$("sheetClose").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
$("fab").addEventListener("click", () => openSheet("import"));

/* 启动 */
(function boot(){
  const d = new Date();
  $("clock").textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
  renderMain();
  // 演示崩溃恢复浮层（4 秒后自动收起）
  setTimeout(()=>{ $("crash").classList.add("on"); }, 1200);
  setTimeout(()=>{ $("crash").classList.remove("on"); }, 9000);
})();
</script>
